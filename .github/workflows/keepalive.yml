name: Keepalive

# Calls public.ping() on the Supabase project every 3 days so the free project never pauses.
# See docs/KEEPALIVE.md.
on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase (fails unless HTTP 200)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "ping returned HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping failed (HTTP $code); the project may be paused"
            exit 1
          fi

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Re-enabling the workflow resets that timer.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
